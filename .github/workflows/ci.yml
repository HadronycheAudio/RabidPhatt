# Every Hadronyche plug-in's CI is the same, so it lives in HadronycheCore's .github/workflows/plugin-ci.yml. The commit
# in `uses:` is the one that `external/hadronychecore` points at, and moves with it.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  ci:
    uses: HadronycheAudio/HadronycheCore/.github/workflows/plugin-ci.yml@fc674d36156009e977dbecd3697d83463dabf613
    # The release job needs write, and the others take read.
    permissions:
      contents: write
    with:
      name: RabidPhatt
      au_type: aumu
      au_subtype: RbPh
